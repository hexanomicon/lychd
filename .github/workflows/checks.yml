name: Repository Checks

# Altar and documentation gates report on every PR and long-lived branch push.
# Full Python, PostgreSQL and isolated Scout qualification are manually dispatched. Python
# runs inside the reviewed test image, including its Podman 5 Quadlet generator.
# Passing these gates does not qualify deployed host services.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      scope:
        description: Run ordinary contracts or the separate isolated Scout qualification
        type: choice
        options: [contracts, scout]
        default: contracts

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  scout-qualification:
    name: Scout isolated network qualification
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'scout'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LYCHD_TEST_ENGINE: docker
      LYCHD_SCOUT_QUALIFICATION_PROFILE: trusted-scout-ci-c1
      DOCKER_CONTEXT: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start the separately admitted pinned qualification engine
        id: scout-engine
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          version: v29.9.3
          context: lychd-scout-qualification
          set-host: true
          rootless: false
          runtime-basedir: ${{ runner.temp }}/lychd-scout-docker

      - name: Observe the qualification engine
        run: docker version

      - name: Admit only the owned trusted setup AppArmor policy
        env:
          LYCHD_SCOUT_QUALIFICATION_OUTPUT: ${{ runner.temp }}/scout-qualification
          LYCHD_SCOUT_DOCKER_SOCKET: ${{ steps.scout-engine.outputs.sock }}
          DOCKER_HOST: ${{ steps.scout-engine.outputs.sock }}
        run: |
          umask 077
          mkdir "$LYCHD_SCOUT_QUALIFICATION_OUTPUT" "$RUNNER_TEMP/scout-apparmor"
          sudo -n --preserve-env=LYCHD_SCOUT_QUALIFICATION_PROFILE,LYCHD_SCOUT_QUALIFICATION_OUTPUT,LYCHD_SCOUT_DOCKER_SOCKET,DOCKER_HOST,DOCKER_CONTEXT \
            python3 -I -S scripts/scout_qualification.py --apparmor-load "$RUNNER_TEMP/scout-apparmor"

      - name: Run the maintained Scout qualification adapter
        shell: bash
        env:
          LYCHD_SCOUT_QUALIFICATION_OUTPUT: ${{ runner.temp }}/scout-qualification
          LYCHD_SCOUT_DOCKER_SOCKET: ${{ steps.scout-engine.outputs.sock }}
          DOCKER_HOST: ${{ steps.scout-engine.outputs.sock }}
        run: |
          umask 077
          mkdir -p "$LYCHD_SCOUT_QUALIFICATION_OUTPUT"
          bash scripts/container_scout_qualification.sh

      - name: Retire only the verified unused owned AppArmor policy
        if: always()
        env:
          LYCHD_SCOUT_DOCKER_SOCKET: ${{ steps.scout-engine.outputs.sock }}
          DOCKER_HOST: ${{ steps.scout-engine.outputs.sock }}
        run: |
          if [[ -f "$RUNNER_TEMP/scout-apparmor/state.json" ]]; then
            sudo -n --preserve-env=LYCHD_SCOUT_QUALIFICATION_PROFILE,LYCHD_SCOUT_DOCKER_SOCKET,DOCKER_HOST,DOCKER_CONTEXT \
              python3 -I -S scripts/scout_qualification.py --apparmor-remove "$RUNNER_TEMP/scout-apparmor"
          fi

      - name: Retain only safe qualification exports and build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scout-qualification-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scout-apparmor/state.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/raw/*.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/result.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/occurrence.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/engine-version.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/engine-preflight.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/images.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/host-before.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/host-after.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/profile-identity.json
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/source-manifest.sha256
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/seccomp.sha256
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/base-build.log
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/adapter-build.log
            ${{ runner.temp }}/scout-qualification/scout-qualification.*/container-logs.bin

  python:
    name: Python contracts ${{ matrix.python-version }}
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'scout'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.8", "3.15.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYCHD_TEST_ENGINE: docker
      LYCHD_TEST_PYTHON: ${{ matrix.python-version }}
      PYTEST_BASETEMP: .cache/pytest/python-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run repository Python gate in the OCI test image
        run: make check

  postgres:
    name: Disposable PostgreSQL receipts ${{ matrix.python-version }}
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'scout'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.8", "3.15.0"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LYCHD_TEST_ENGINE: docker
      LYCHD_TEST_PYTHON: ${{ matrix.python-version }}
      LYCHD_TEST_DAEMON_SOCKET: /var/run/docker.sock
      PYTEST_BASETEMP: .cache/pytest/postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run PostgreSQL receipts in the test image with explicit daemon access
        run: make test-containers N=0

  altar:
    name: Altar contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.15.0"
          enable-cache: true
          cache-suffix: checks-altar

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install pinned npm and Altar dependencies
        run: |
          npm install --global npm@12.0.2
          npm ci --prefix clients/web

      - name: Check and build the Altar
        run: |
          env -u GITHUB_SHA make frontend-check
          env -u GITHUB_SHA make frontend-build

      - name: Verify generated projections are current
        shell: bash
        run: |
          generated_paths=(
            clients/web/openapi.json
            clients/web/src/lib/api/openapi.d.ts
            clients/web/static/THIRD_PARTY_NOTICES.txt
            src/lychd/public
          )
          generated_status="$(git status --porcelain=v1 --untracked-files=all -- "${generated_paths[@]}")"
          if [[ -n "$generated_status" ]]; then
            echo "Generated Altar projections are stale or untracked:"
            printf '%s\n' "$generated_status"
            exit 1
          fi

  documentation:
    name: Hexanomicon build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.15.0"
          enable-cache: true
          cache-suffix: checks-documentation
          # The clean documentation build can remove the uv cache directory.
          ignore-nothing-to-cache: true

      - name: Build published documentation
        run: uv run --only-group docs zensical build --clean
