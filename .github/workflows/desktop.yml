name: Desktop host CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - ".github/actions/desktop-postgres/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
      - "scripts/check_desktop_bridge.py"
      - "scripts/check_desktop_startup.py"
      - "scripts/check_desktop_apfs_clone.py"
      - "scripts/check_windows_desktop.ps1"
      - "tests/integration/test_native_pg_backup.py"
      - "tests/unit/cli/test_native_entry.py"
      - "tests/unit/system/desktop/**"
      - "tests/unit/domain/web/test_vessel_owner.py"
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      bridge_chat:
        description: Run real browser inference and verify the conversation after restart
        type: boolean
        default: false

env:
  BRIDGE_CHAT: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.bridge_chat) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
         contains(github.event.pull_request.body, '[run-desktop-bridge]')) }}

permissions:
  contents: read

jobs:
  desktop:
    name: Personal host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14.8"
      - name: Install the project and check desktop entrypoints before system dependency setup
        run: |
          uv sync --locked --no-default-groups --extra postgres-binary --group test --group desktop-browser --no-editable
          uv run --no-sync lychd --help
          uv run --no-sync lychd platform
          uv run --no-sync lychd desktop --help
          uv run --no-sync python scripts/check_desktop_bridge.py --help
          uv run --no-sync python -c "from lychd.app import create_app; from lychd.interface.server import run_native_server"
      - name: Check desktop routing and the database ownership protocol
        if: runner.os == 'macOS'
        run: uv run --no-sync python -m pytest -q -o addopts= tests/unit/cli/test_native_entry.py tests/unit/domain/web/test_vessel_owner.py tests/unit/system/desktop
      - uses: ./.github/actions/desktop-postgres
      - name: Recover an actual committed PostgreSQL row
        if: runner.os == 'macOS'
        run: uv run --no-sync python -m pytest -q -o addopts= tests/integration/test_native_pg_backup.py
      - name: Install twice and exercise the authenticated local Vessel
        if: runner.os == 'macOS' && env.BRIDGE_CHAT != 'true'
        env:
          PGHOSTADDR: 127.0.0.2
        run: uv run --no-sync python scripts/check_desktop_startup.py
      - name: Install the pinned official Apple Silicon inference archive
        if: runner.os == 'macOS' && env.BRIDGE_CHAT == 'true'
        run: |
          archive="$RUNNER_TEMP/llama-b12494-bin-macos-arm64.tar.gz"
          curl --fail --location --silent --show-error --max-filesize 17249612 --max-time 180 --output "$archive" \
            https://github.com/ggml-org/llama.cpp/releases/download/b12494/llama-b12494-bin-macos-arm64.tar.gz
          echo "cb4a5089fcaaa69a493bbf86eae25002dd82966eacecd166c49282881906ab3a  $archive" | shasum -a 256 -c -
          mkdir -p .ci-llama/build/bin
          tar -xzf "$archive" -C .ci-llama/build/bin
      - name: Install the pinned official Windows CPU inference archive
        if: runner.os == 'Windows' && env.BRIDGE_CHAT == 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llama-b12494-bin-win-cpu-x64.zip'
          $source = 'https://github.com/ggml-org/llama.cpp/releases/download/b12494/llama-b12494-bin-win-cpu-x64.zip'
          curl.exe --fail --location --silent --show-error --max-filesize 25488851 --max-time 180 --output $archive $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '04a6c6389359f7b3aa7c94e6e373beb1df4afeca7a0851856a0d826a29afa1b7') {
            throw 'Windows inference distribution checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath .ci-llama/build/bin
      - name: Verify the pinned model and locate the inference server
        if: env.BRIDGE_CHAT == 'true'
        shell: pwsh
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'qwen2.5-0.5b-instruct-q4_k_m.gguf'
          $source = 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf'
          curl --fail --location --silent --show-error --max-filesize 491400032 --max-time 300 --output $model $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $model -Algorithm SHA256).Hash -ne '74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db') {
            throw 'Qualification model checksum mismatch.'
          }
          "BRIDGE_MODEL=$model" >> $env:GITHUB_ENV
          $binary = if ($IsWindows) { 'llama-server.exe' } else { 'llama-server' }
          $engine = @(Get-ChildItem -Path .ci-llama/build/bin -Recurse -File -Filter $binary)
          if ($engine.Count -ne 1) { throw 'Expected one built llama-server.' }
          "BRIDGE_ENGINE=$($engine[0].FullName)" >> $env:GITHUB_ENV
      - name: Exercise browser chat and verify the answer after native restart
        if: runner.os == 'macOS' && env.BRIDGE_CHAT == 'true'
        env:
          PGHOSTADDR: 127.0.0.2
        run: |
          uv run --no-sync python scripts/check_desktop_bridge.py --engine "$BRIDGE_ENGINE" --model "$BRIDGE_MODEL" --output bridge-evidence
      - name: Exercise PostgreSQL recovery and the Vessel as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_windows_desktop.ps1
      - name: Retain the synthetic Bridge screens and receipt
        if: always() && env.BRIDGE_CHAT == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-bridge-${{ runner.os }}
          path: bridge-evidence/
          if-no-files-found: ignore
          retention-days: 7
