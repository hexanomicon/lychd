name: Desktop Tether

on:
  pull_request:
    paths:
      - "clients/desktop-tether/**"
      - ".github/workflows/desktop-tether.yml"
      - "scripts/check_windows_desktop.ps1"
  push:
    branches: [dev]
    paths:
      - "clients/desktop-tether/**"
      - ".github/workflows/desktop-tether.yml"
      - "scripts/check_windows_desktop.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-peers:
    name: Encrypted service and live revocation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        working-directory: clients/desktop-tether
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: clients/desktop-tether/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go build -trimpath -mod=readonly .
      - name: Exercise WireGuard peers as the macOS login user
        if: runner.os == 'macOS'
        run: go test -mod=readonly -v -timeout 2m ./...
      - name: Exercise WireGuard peers under a new standard Windows account
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: ./scripts/check_windows_desktop.ps1 -TetherTrial
