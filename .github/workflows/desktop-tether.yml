name: Desktop Tether

on:
  pull_request:
    paths:
      - "clients/desktop-tether/**"
      - ".github/workflows/desktop-tether.yml"
  push:
    branches: [dev]
    paths:
      - "clients/desktop-tether/**"
      - ".github/workflows/desktop-tether.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-peers:
    name: Encrypted service and live revocation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    defaults:
      run:
        working-directory: clients/desktop-tether
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: clients/desktop-tether/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go build -trimpath -mod=readonly .
      - run: go test -mod=readonly -v -timeout 2m ./...
