name: Core Python CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: core-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }} (OCI test image)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.8", "3.15.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LYCHD_TEST_ENGINE: docker
      LYCHD_TEST_PYTHON: ${{ matrix.python-version }}
      PYTEST_BASETEMP: .cache/pytest/core-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check and test Core in the source-bound OCI image
        run: bash scripts/container_checks.sh lint format-check type-check test-ci
