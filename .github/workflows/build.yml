name: Release Candidate (No Publication)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UV_CACHE_DIR: .cache/uv
      RELEASE_REVISION: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      RELEASE_ARTIFACT_DIR: dist
    steps:
      - name: Check out the immutable candidate source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python and uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.28"
          python-version: "3.13"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned npm and Altar dependencies
        run: |
          npm install --global npm@11.16.0
          npm ci --prefix frontend

      - name: Build and audit the candidate
        run: make release-candidate

      - name: Retain private candidate archives
        uses: actions/upload-artifact@v4
        with:
          name: lychd-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
