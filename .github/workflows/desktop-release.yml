name: Desktop installers (no publication)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - ".github/actions/desktop-postgres/**"
      - "scripts/check_desktop_package_rows.py"
      - "scripts/check_windows_desktop.ps1"
      - ".github/workflows/desktop-release.yml"
      - "deployments/desktop-packaging/**"
      - "src/lychd/system/desktop/**"
      - "clients/desktop-tether/**"
      - "docs/deployments/desktop-packages.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".nvmrc"
  push:
    branches: [dev]
    paths:
      - ".github/actions/desktop-postgres/**"
      - ".github/workflows/desktop-release.yml"
      - "clients/desktop-tether/**"
      - "clients/web/**"
      - "deployments/desktop-packaging/**"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".nvmrc"
  workflow_dispatch:
    inputs:
      previous_run:
        description: Successful Desktop installers run ID for an optional populated upgrade trial
        type: string
        required: false
      previous_revision:
        description: Full edition revision from that run's provenance.json
        type: string
        required: false

permissions:
  contents: read

jobs:
  native:
    name: Build, install and repair (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Keep reviewed license and source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.14.8"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: clients/desktop-tether/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm install --global npm@12.0.2
      - name: Install the pinned Windows packaging compiler for the build account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/innosetup-7.1.1-x64.exe"
          $tools = "$env:RUNNER_TEMP/inno"
          Invoke-WebRequest -OutFile $setup -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          if ((Get-FileHash $setup).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup checksum mismatch.' }
          $result = Start-Process $setup -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$tools`"" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "Inno Setup installation failed ($($result.ExitCode))." }
          $tools >> $env:GITHUB_PATH
      - name: Build the unsigned installer
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lychd-desktop'
          ./deployments/desktop-packaging/build.ps1 -Revision $env:GITHUB_SHA -BuildDirectory $build
      - name: Verify real current-user Windows startup before database setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check_windows_desktop.ps1 -PackageBuild "$env:RUNNER_TEMP/lychd-desktop" -PackageRevision $env:GITHUB_SHA -PackageLoginOnly
      - uses: ./.github/actions/desktop-postgres
      - name: Exercise installation, repair and removal with a populated database
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lychd-desktop'
          if ($IsWindows) {
              ./scripts/check_windows_desktop.ps1 -PackageBuild $build -PackageRevision $env:GITHUB_SHA
          } else {
              ./deployments/desktop-packaging/check-install.ps1 -Revision $env:GITHUB_SHA -BuildDirectory $build
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-installer-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/lychd-desktop/artifacts/
          if-no-files-found: error
          retention-days: 14

  upgrade:
    name: Populated two-edition upgrade (${{ matrix.os }})
    needs: native
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.previous_run != '') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, '[desktop-upgrade '))
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify both installers against the selected same-project artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./deployments/desktop-packaging/fetch-upgrade.ps1 -BuildDirectory "$env:RUNNER_TEMP/lychd-upgrade"
      - uses: ./.github/actions/desktop-postgres
      - name: Recover a pre-switch backup and verify old and new commits in the upgraded database
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'lychd-upgrade'
          if ($IsWindows) {
              ./scripts/check_windows_desktop.ps1 -PackageBuild $build -PackageRevision $env:GITHUB_SHA -PreviousRevision $env:PREVIOUS_EDITION
          } else {
              ./deployments/desktop-packaging/check-upgrade.ps1 -BuildDirectory $build -Revision $env:GITHUB_SHA -PreviousRevision $env:PREVIOUS_EDITION
          }
