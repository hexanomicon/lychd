name: Deployment bootstrap checks

on:
  pull_request:
    paths:
      - deployments/**
      - .github/workflows/deployments.yml
  push:
    branches: [main, dev]
    paths:
      - deployments/**
      - .github/workflows/deployments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tumbleweed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install isolated Python tooling
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.13.14"
          enable-cache: false
      - name: Prepare the isolated controller
        run: |
          uv venv --python 3.13.14 "$RUNNER_TEMP/deployment-controller"
          uv pip install --python "$RUNNER_TEMP/deployment-controller/bin/python" -r deployments/ansible/requirements-checks.txt
      - name: Check deployment contracts, formatting, syntax and host selection without contacting a target
        run: bash deployments/check.sh "$RUNNER_TEMP/deployment-controller"
