version: 2

# Keep team integration reviewable: at most two version-update PRs per ecosystem.
# Group routine updates; review major-version changes separately.
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /clients/web
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 2
    groups:
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 2
    groups:
      workflow-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
