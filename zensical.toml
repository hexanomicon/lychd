[project]
site_name = "Hexanomicon"
site_author = "Hexanomicon contributors"
site_description = "Systemd-native daemon for local agentic orchestration"
site_url = "https://hexanomicon.dev/"
docs_dir = "docs"
repo_name = "hexanomicon/lychd"
repo_url = "https://github.com/hexanomicon/lychd"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Hexanomicon contributors &ndash;"

extra_css = ["overrides/stylesheets/hexanomicon.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.plugins.awesome-nav]

[project.theme]
name = "material"
logo = "assets/hexanomicon.png"
favicon = "assets/hexanomicon.png"
custom_dir = "scripts/docs"
features = [
    "navigation.instant",
    "navigation.indexes",
    "navigation.footer",
    "navigation.tracking",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
    "content.action.view"
]

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "cyan"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
base_path = ["."]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hexanomicon"
name = "hexanomicon on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/lychd/"
name = "lychd on PyPI"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:hexanomicon@proton.me"
name = "Contact the Magus"
