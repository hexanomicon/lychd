/head><body><style>#lych-orb .trace-map {
  --tm-run:#c6a5e8;
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:#19161e;color:#dad5df;
  container-type:inline-size;
}
.trace-map .tm-header {
  display:flex;gap:8px;align-items:center;min-height:56px;
  padding:10px 10px 8px 15px;border-bottom:1px solid #322c39;flex:none;
}
#lych-orb .tm-heading {font:550 16px/1.25 Inter,"Segoe UI",sans-serif;color:#efe8f3;}
.trace-map .tm-cursor {color:#b2a6bc;font:11px/1.3 ui-monospace,monospace;white-space:nowrap;}
.trace-map button {font:inherit;}
.trace-map .tm-hide,.trace-map .tm-toggle,.trace-map .tm-label,.trace-map .tm-time {
  border:0;background:transparent;box-shadow:none;margin:0;
}
.trace-map .tm-hide {margin-left:auto;display:grid;place-items:center;color:#bbafc6;width:26px;height:26px;padding:0;border-radius:4px;}
.trace-map .tm-hide:hover,.trace-map .tm-toggle:hover {background:#3b3245;color:#f4eafd;}
.trace-map .tm-scroll {
  min-height:0;flex:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#534859 transparent;
  padding:9px 5px 10px;
}
.trace-map .tm-tree,.trace-map .tm-group,.trace-map .tm-item {list-style:none;margin:0;padding:0;}
.trace-map .tm-item {outline-offset:-2px!important;}
.trace-map .tm-row {
  --tm-offset:calc(min(var(--tm-depth),7) * 6px);
  display:flex;align-items:center;gap:1px;position:relative;
  padding:1px 5px 1px calc(2px + var(--tm-offset));
  min-height:28px;border-radius:5px;color:#c8c0d0;
}
.trace-map .tm-item[data-kind=run] > .tm-row {min-height:35px;color:#f4eefa;}
.trace-map .tm-tree > .tm-item + .tm-item {margin-top:8px;border-top:1px solid #332d39;padding-top:5px;}
.trace-map .tm-row:hover {background:#28222f;color:#f1e6fa;}
.trace-map .tm-item[aria-selected=true] > .tm-row {background:#3b2f46;color:#f6eafa;box-shadow:inset 2px 0 0 #b899d0;}
.trace-map .tm-item[aria-current=location][data-kind=run] > .tm-row .tm-name {text-decoration:underline;text-decoration-color:var(--tm-run);text-underline-offset:3px;}
#lych-orb .tm-item:focus-visible {outline:none;}
#lych-orb .tm-item:focus-visible > .tm-row {outline:2px solid #d6b6f0;outline-offset:-2px;}
.trace-map .tm-toggle {flex:none;display:grid;place-items:center;width:14px;height:22px;padding:0;border-radius:3px;color:#b1a4b9;}
.trace-map .tm-toggle[aria-expanded=true] svg {transform:rotate(90deg);}
.trace-map .tm-item[aria-level]:not([aria-level="1"]) > .tm-row::before {
  content:"";width:5px;height:1px;background:#504654;position:absolute;left:calc(var(--tm-offset) - 3px);
}
.trace-map .tm-label {
  display:flex;align-items:center;gap:5px;flex:1;min-width:0;text-align:left;
  padding:4px 1px;color:inherit;font-size:12px;line-height:1.25;
}
.trace-map .tm-name {min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trace-map .tm-item[data-kind=run] > .tm-row .tm-label {font-weight:600;font-size:12px;}
.trace-map .tm-glyph {flex:none;display:grid;place-items:center;color:#ac9bb9;}
.trace-map .tm-item[data-kind=run] > .tm-row .tm-glyph {color:var(--tm-run);}
.trace-map .tm-item[data-kind=agent] > .tm-row .tm-glyph,.trace-map .tm-item[data-kind=analysis] > .tm-row .tm-glyph {color:#a1bbd8;}
.trace-map .tm-item[data-kind=folder] > .tm-row .tm-glyph,.trace-map .tm-item[data-kind=file] > .tm-row .tm-glyph {color:#cab285;}
.trace-map .tm-item[data-operation=read] > .tm-row .tm-glyph {color:#98c9a8;}
.trace-map .tm-item[data-operation=edit] > .tm-row .tm-glyph {color:#e5ac7a;}
.trace-map .tm-item[data-operation=delete] > .tm-row .tm-glyph {color:#dc9198;}
.trace-map .tm-item[data-kind=reach] > .tm-row .tm-glyph {color:#8fbdb5;}
.trace-map .tm-item[data-kind=checkpoint] > .tm-row .tm-glyph,.trace-map .tm-item[data-kind=human] > .tm-row .tm-glyph {color:#d7a0c5;}
.trace-map .tm-time {
  flex:none;padding:4px 2px 4px 3px;color:#b9afc2;border-radius:3px;
  text-align:right;white-space:nowrap;font:10.5px/1.25 ui-monospace,monospace;font-variant-numeric:tabular-nums;
}
.trace-map .tm-time:hover:not(:disabled) {color:#f7edfc;background:#46384c;text-decoration:underline;text-underline-offset:2px;}
.trace-map .tm-item[data-timing=active] > .tm-row .tm-time {color:#bdcbea;}
.trace-map .tm-item[data-timing=waiting] > .tm-row .tm-time {color:#efb1d2;}
.trace-map .tm-item[data-timing=waiting] > .tm-row .tm-name {color:#ecd1e2;}
.trace-map .tm-item[data-timing=point] > .tm-row .tm-time {color:#b2a4be;}
.trace-map .tm-item[data-timing=unknown] > .tm-row .tm-time {color:#a196ac;}
.trace-map .tm-empty {padding:17px 10px;font-size:12px;color:#b6aabe;}
.trace-map .tm-legend {display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:10px 12px;border-top:1px solid #322b39;font-size:11px;color:#b2a6bc;}
.trace-map .tm-legend b {font:11px ui-monospace,monospace;color:#d8cce2;}
@container(max-width:230px) {
  .trace-map .tm-row {--tm-offset:calc(min(var(--tm-depth),7) * 4px);padding-right:3px;}
  .trace-map .tm-label {gap:4px;}
}

#lych-orb .orb-map-pane {
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
}
.orb-map-minimap .of-mini {
  min-width:0;
  padding:0 9px;
  border-top:1px solid #3c3443;
  background:#19161e;
  color:#ded4e6;
}
.of-mini button {display:block;border:0;margin:0;background:transparent;color:inherit;}
.of-mini .of-mini-toggle {
  display:flex;align-items:center;gap:6px;width:100%;min-height:33px;padding:4px;
  border-radius:4px;text-align:left;font:550 12px/1.3 Inter,"Segoe UI",sans-serif;
}
.of-mini-toggle:hover {background:#302835;}
.of-mini-toggle svg {width:14px;height:14px;color:#c7a9db;}
.of-mini-caret {
  width:6px;height:6px;margin:0 5px 0 auto;
  border-right:1px solid #baadbf;border-top:1px solid #baadbf;transform:rotate(45deg);
}
.of-mini-toggle[aria-expanded=true] .of-mini-caret {transform:rotate(135deg);}
.of-mini .of-mini-surface {
  width:100%;margin:0 0 9px;padding:0;overflow:hidden;
  border:1px solid #3c3343;border-radius:5px;background:#151219;
  cursor:crosshair;touch-action:manipulation;
}
.of-mini-surface svg {display:block;width:100%;height:auto;max-height:clamp(62px,15vh,116px);}
.of-mini button:focus-visible {outline-offset:-2px!important;}
.of-mini-view {fill:#cfafe6;fill-opacity:.095;}
.of-mini-rim {fill:none;stroke:#dec1ed;stroke-width:1;}
.of-mini-at-fit .of-mini-rim {stroke:#a899b5;stroke-width:.75;}
.of-mini-wires {stroke:#8c8197;stroke-width:.8;stroke-opacity:.8;}
.of-mini-wires .of-mini-traced {stroke:#f0cce8;stroke-opacity:1;}
.of-mini-star {color:var(--run-docs,#c6a5e8);}
.of-mini-star[data-mini-run=ci] {color:var(--run-ci,#78cdd6);}
.of-mini-star.of-mini-wait {color:#f1aacf;}
.of-mini-core {fill:currentColor;}
.of-mini-glint {fill:#fff1ef;}
.of-mini-selection {stroke:#fff0ff;stroke-width:1.2;fill:none;}
.of-mini-label {font:6px/1 ui-monospace,monospace;fill:currentColor;paint-order:stroke;stroke:#19151c;stroke-width:1.35;}
.of-mini-outside {fill:#d3b6e5;}
#lych-orb {
  --rail:153px;--head:59px;--dock:275px;--run-docs:#c6a5e8;--run-ci:#78cdd6;
  --text:#eeeaf3;--soft:#b3aabc;--mute:#aca1b8;--line:#35303d;--panel:#19161e;
  position:relative;isolation:isolate;box-sizing:border-box;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);
  width:100%;min-width:0;height:clamp(696px,77vw,855px);overflow:hidden;color-scheme:dark;
  color:var(--text);background:#131018;font:14px/1.45 Inter,"Segoe UI",sans-serif;text-align:left;
}
#lych-orb *,#lych-orb *::before,#lych-orb *::after {box-sizing:border-box;}
:where(#lych-orb) button {font-family:inherit;color:inherit;cursor:pointer;}
#lych-orb button:focus-visible,#lych-orb a:focus-visible,#lych-orb [tabindex]:focus-visible {outline:2px solid #d6b6f0;outline-offset:2px;}
#lych-orb [hidden] {display:none!important;}
#lych-orb h1,#lych-orb h2,#lych-orb h3,#lych-orb p {margin:0;}
#lych-orb .orb-main {display:flex;flex-direction:column;min-height:0;min-width:0;background:#131118;}
#lych-orb .orb-upper {position:relative;flex:1;min-height:0;display:flex;}
#lych-orb .orb-canvas-column {min-width:0;flex:1;display:flex;flex-direction:column;background:#141119;}
#lych-orb .orb-heading {position:relative;z-index:1;display:flex;align-items:center;gap:13px;padding:12px 5px 6px 20px;min-height:56px;background:#141119;}
#lych-orb .orb-heading h1 {font:normal 30px/1.13 Georgia,"Times New Roman",serif;color:#f7f1fb;letter-spacing:-1px;}
#lych-orb .capture-tag {font:11px/1.5 ui-monospace,monospace;letter-spacing:.015em;color:#b8aebe;border-left:1px solid #494050;padding-left:12px;}
#lych-orb .open-side {margin-left:auto;}
#lych-orb .open-side,#lych-orb .side-tool {display:grid;place-items:center;background:transparent;border:0;width:33px;height:32px;border-radius:6px;color:#b9afc2;}
#lych-orb .open-side:hover,#lych-orb .side-tool:hover {background:#322b3a;color:#fcf6ff;}
#lych-orb .orb-field-mount {flex:1;position:relative;isolation:isolate;min-width:0;min-height:0;overflow:hidden;}
#lych-orb .orb-history-mount {flex:none;min-width:0;position:relative;z-index:2;}
#lych-orb .orb-rail {display:flex;flex-direction:column;background:#1b1820;min-width:0;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;border-right:1px solid var(--line);}
#lych-orb.rail-folded {--rail:53px;}
#lych-orb .orb-side {width:var(--dock);max-width:70%;min-width:0;position:relative;display:flex;flex-direction:column;z-index:3;border-left:1px solid #423847;background:var(--panel);}
#lych-orb .orb-split {position:absolute;left:-4px;width:9px;top:0;bottom:0;cursor:col-resize;touch-action:none;z-index:2;}
#lych-orb .orb-split:hover,#lych-orb .orb-split:focus-visible {background:#a085b34a;}
#lych-orb .orb-side-content {overflow:auto;scrollbar-width:thin;min-height:0;padding:22px 18px 26px;}
#lych-orb .orb-sidebar-tools {display:flex;align-items:center;gap:3px;flex:none;padding:10px 5px;border-bottom:1px solid var(--line);}
#lych-orb .orb-sidebar-tools .orb-panel-fold {position:relative;margin-right:5px;}
#lych-orb .orb-panel-fold::after {content:"";position:absolute;right:-3px;height:17px;border-right:1px solid var(--line);}
#lych-orb .orb-panel-chevrons {display:inline-flex;align-items:center;justify-content:center;}
#lych-orb .orb-panel-chevrons svg+svg {margin-left:-9px;}
@media(pointer:coarse){#lych-orb .orb-panel-fold,#lych-orb .open-side{min-width:40px;min-height:42px;}}
#lych-orb .side-tool[aria-pressed=true] {background:#44334e;color:#e7c3ff;}
#lych-orb .dock-kicker,#lych-orb .panel-section h3 {color:#b5a8c0;font:500 11px/1.5 ui-monospace,monospace;text-transform:uppercase;letter-spacing:.085em;}
#lych-orb .dock-kicker {display:flex;align-items:center;gap:8px;}
#lych-orb .dock-kicker b {background:var(--run-color,#c6a5e8);width:6px;height:6px;border-radius:50%;}
#lych-orb .orb-side-content h2 {font:normal 25px/1.17 Georgia,serif;margin:9px 0 10px;color:#faf4fd;letter-spacing:-.55px;}
#lych-orb .dock-note {color:#cbc2d2;font-size:13px;line-height:1.6;}
#lych-orb .dock-clock {font:12px/1.45 ui-monospace,monospace;color:#dabcec;display:flex;align-items:center;gap:7px;margin:12px 0 0;}
#lych-orb .dock-clock.wait {color:#f5add2;}
#lych-orb .panel-section {border-top:1px solid var(--line);margin-top:19px;padding-top:15px;}
#lych-orb .panel-section h3 {margin:0 0 9px;}
#lych-orb .record-meta {display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 13px;align-items:baseline;margin:0;font-size:12px;}
#lych-orb .record-meta dt {color:#b4a8bf;}
#lych-orb .record-meta dd {margin:0;color:#e6dde9;text-align:right;overflow-wrap:anywhere;}
#lych-orb .panel-link,#lych-orb .dock-button {display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.4;}
#lych-orb .panel-link {background:transparent;border:0;padding:6px 1px;text-align:left;width:100%;color:#e1d6e8;}
#lych-orb .panel-link small {margin-left:auto;color:#b0a4b9;font:11px ui-monospace,monospace;}
#lych-orb .panel-link:hover {color:#fff;text-decoration:underline;}
#lych-orb .dock-button {margin:11px 0 4px;padding:6px 9px;background:#302736;border:1px solid #54405f;border-radius:6px;color:#edd6fc;}
#lych-orb .dock-button[aria-pressed=true] {background:#493450;}
#lych-orb .dock-small {font-size:12px;color:#b9adbF;line-height:1.6;}
#lych-orb .dock-question {margin:10px 0;color:#ead8e5;border-left:2px solid #bc82a6;padding:3px 0 3px 9px;font-size:13px;line-height:1.5;}
#lych-orb .orb-announcement {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
#lych-orb .dock-pre {white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 0;padding:10px;border:1px solid var(--line);border-radius:6px;font:12px/1.5 ui-monospace,monospace;}
