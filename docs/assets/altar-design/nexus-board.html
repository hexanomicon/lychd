><style>#altar-nexus {
  --rail:146px;--head:59px;--directory:169px;--pane:292px;--line:#38323f;--faint-line:#2c2632;
  --ink:#f1edf4;--soft:#bbb2c4;--muted:#a69bad;--violet:#cfb0e6;
  --sans:Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif;--serif:"Bitstream Charter","DejaVu Serif",Georgia,serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  width:100%;height:clamp(714px,77vw,845px);min-width:0;display:flex;isolation:isolate;position:relative;overflow:hidden;
  color-scheme:dark;background:#17141b;color:var(--ink);font:14px/1.45 var(--sans);text-align:left;box-sizing:border-box;
}
#altar-nexus *,#altar-nexus ::before,#altar-nexus ::after{box-sizing:border-box;}
#altar-nexus [hidden]{display:none!important;}
#altar-nexus :is(h1,h2,h3,h4,p,dl,dd,dt){margin:0;}
#altar-nexus button,#altar-nexus input {font-family:inherit;color:inherit;}
#altar-nexus button {cursor:pointer;}
#altar-nexus :is(button,a,input,[tabindex]):focus-visible {outline:2px solid #d9b2ef;outline-offset:2px;}
#altar-nexus svg {flex:none;}
#altar-nexus .nx-rail {flex:0 0 var(--rail);width:var(--rail);display:flex;flex-direction:column;overflow:auto;scrollbar-width:thin;border-right:1px solid var(--line);background:#19161d;z-index:3;}
#altar-nexus.rail-folded {--rail:50px;}
#altar-nexus .altar-brand strong {font:600 21px/1 var(--serif);}
#altar-nexus .nx-work {position:relative;display:flex;min-width:0;flex:1;min-height:0;}
#altar-nexus .nx-directory {position:relative;flex:0 0 var(--directory);width:var(--directory);background:#1c1821;border-right:1px solid var(--line);min-width:0;z-index:4;display:flex;flex-direction:column;}
#altar-nexus .nx-directory-head {padding:14px 10px 12px 16px;display:flex;align-items:center;justify-content:space-between;min-height:59px;}
#altar-nexus .nx-directory-head h2 {font:500 20px/1.2 var(--serif);letter-spacing:-.4px;}
#altar-nexus .nx-section-links {padding:11px 8px;overflow:auto;scrollbar-width:thin;}
#altar-nexus .nx-section-links h3 {font-size:10.5px;text-transform:uppercase;letter-spacing:.085em;color:#aa9bb7;font-weight:600;margin:25px 0 7px 8px;}
#altar-nexus .nx-section-links button {border:0;color:#d8cfdf;display:flex;align-items:center;gap:9px;background:transparent;border-radius:6px;padding:8px 9px;width:100%;text-align:left;font-size:13px;margin-bottom:2px;}
#altar-nexus .nx-section-links button[aria-current=page] {color:#ead6f6;background:#3a2e43;box-shadow:inset 2px 0 #b58acd;}
#altar-nexus .nx-section-links button:not([aria-current]):hover {background:#2a2430;}
#altar-nexus .nx-main {flex:1;min-width:0;overflow:auto;scrollbar-width:thin;container-type:inline-size;background:#16131a;}
#altar-nexus .nx-meta {height:59px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--faint-line);padding:0 clamp(16px,3.5cqw,38px);color:var(--soft);}
#altar-nexus .nx-environment {font:12px/1.3 var(--mono);display:flex;align-items:center;gap:8px;}
#altar-nexus .nx-environment::before {content:"";width:7px;height:7px;border-radius:2px;background:#a991b5;box-shadow:0 0 0 3px #302936;}
#altar-nexus .nx-sample {font:11px/1.3 var(--mono);color:#ab9db5;border-left:1px solid #4b4151;padding-left:10px;}
#altar-nexus .nx-open-tools {margin-left:auto;}
#altar-nexus .nx-icon {display:inline-grid;place-items:center;width:31px;height:31px;border:0;border-radius:5px;background:transparent;color:var(--soft);}
#altar-nexus .nx-icon:hover {background:#312936;color:var(--ink);}
#altar-nexus .nx-icon[aria-pressed=true] {background:#483451;color:#edcef7;}
#altar-nexus .nx-content {max-width:1180px;margin:0 auto;padding:clamp(20px,3.5cqw,38px) clamp(16px,3.5cqw,38px) 32px;}
#altar-nexus .nx-heading {margin-bottom:23px;}
#altar-nexus .nx-heading h1 {font:500 clamp(29px,5.3cqw,42px)/1.12 var(--serif);letter-spacing:-.034em;color:#f4edf6;}
#altar-nexus .nx-heading p {font-size:13px;line-height:1.5;margin-top:7px;color:#bfb5c6;max-width:72ch;}
#altar-nexus .nx-snapshot {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;background:#211c27;border:1px solid #3d3246;border-radius:7px;color:#d6cadf;margin-bottom:23px;}
#altar-nexus .nx-snapshot strong {font-weight:550;display:flex;align-items:center;gap:10px;font-size:13px;}
#altar-nexus .nx-snapshot time {font:12px var(--mono);color:#c1afce;}
#altar-nexus .nx-group+.nx-group {margin-top:23px;}
#altar-nexus .nx-group-title {display:flex;align-items:center;gap:12px;margin-bottom:4px;}
#altar-nexus .nx-group-title h2 {font:500 19px/1.2 var(--serif);letter-spacing:-.3px;}
#altar-nexus .nx-group-title::after {content:"";flex:1;height:1px;background:var(--line);}
#altar-nexus .nx-destination {display:flex;align-items:center;gap:13px;min-height:62px;width:100%;border:0;border-bottom:1px solid var(--faint-line);background:transparent;padding:8px 2px;text-align:left;}
#altar-nexus .nx-destination:hover {background:#211b27;}
#altar-nexus .nx-mark {width:33px;height:33px;border-radius:7px;display:grid;place-items:center;flex:none;color:#cbb2db;background:#302633;}
#altar-nexus .nx-group[data-family=operations] .nx-mark {color:#a7c9cc;background:#233035;}
#altar-nexus .nx-dest-text {display:grid;gap:3px;min-width:0;flex:1;}
#altar-nexus .nx-dest-text strong {font:550 14px/1.24 var(--sans);}
#altar-nexus .nx-dest-text small {font:12px/1.35 var(--sans);color:#b5aabb;}
#altar-nexus .nx-dest-info {font:11px/1.3 var(--mono);color:#b5a8be;text-align:right;}
#altar-nexus .nx-tail {display:grid;place-items:center;color:#91859b;}
#altar-nexus .nx-filterbar {display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:0 0 17px;}
#altar-nexus .nx-search {display:flex;align-items:center;gap:8px;border:1px solid #443a4a;border-radius:6px;background:#201b25;color:#ac9fb6;padding:6px 9px;width:min(100%,270px);}
#altar-nexus .nx-search-mark {display:grid;place-items:center;}
#altar-nexus .nx-search input {background:transparent;border:0;min-width:0;flex:1;width:100%;font:13px var(--sans);}
#altar-nexus .nx-search input::placeholder {color:#afa3b8;}
#altar-nexus .nx-tabs {display:flex;align-items:center;gap:2px;}
#altar-nexus .nx-tabs button {border:0;background:transparent;border-radius:5px;padding:6px 11px;font-size:12px;color:var(--soft);}
#altar-nexus .nx-tabs button[aria-pressed=true] {background:#3b2e45;color:#ebd8f7;}
#altar-nexus .nx-filter-chip {margin:0 0 13px;background:#2b2233;color:#ddc5eb;border:1px solid #4b3a58;padding:4px 8px;border-radius:5px;font:11.5px var(--sans);}
#altar-nexus .nx-results table {width:100%;border-collapse:collapse;table-layout:fixed;text-align:left;}
#altar-nexus .nx-results th {color:#b8a9c4;font:500 11px/1.3 var(--mono);padding:8px 8px 9px;border-bottom:1px solid #4a3e51;}
#altar-nexus .nx-results th:first-child {width:48%;}
#altar-nexus .nx-results th:last-child {width:24%;}
#altar-nexus .nx-results td {border-bottom:1px solid var(--faint-line);padding:12px 8px;font-size:12px;color:#c9bfce;overflow-wrap:anywhere;}
#altar-nexus .nx-results tr[data-id] {cursor:pointer;}
#altar-nexus .nx-results tr[data-id]:hover {background:#231d28;}
#altar-nexus .nx-results tr[data-selected=true] {background:#2e2436;box-shadow:inset 2px 0 #ba90d1;}
#altar-nexus .nx-object {border:0;display:flex;align-items:center;gap:9px;width:100%;min-width:0;text-align:left;background:transparent;padding:0;}
#altar-nexus .nx-object .nx-mark {width:28px;height:28px;border-radius:6px;}
#altar-nexus .nx-object span:last-child {display:grid;min-width:0;gap:4px;}
#altar-nexus .nx-object b {font:550 13px/1.23 var(--sans);color:#f0e8f3;overflow-wrap:anywhere;}
#altar-nexus .nx-object small {font:11px/1.35 var(--mono);color:#afa1ba;overflow-wrap:anywhere;}
#altar-nexus .nx-state {display:inline-flex;align-items:center;gap:6px;font:12px/1.35 var(--sans);}
#altar-nexus .nx-state::before {content:"";width:6px;height:6px;flex:none;border-radius:50%;background:currentColor;}
#altar-nexus .nx-state:is([data-tone=success],[data-tone=good]) {color:#99caae;}
#altar-nexus .nx-state:is([data-tone=warning],[data-tone=warn]) {color:#dcb782;}
#altar-nexus .nx-state:is([data-tone=info],[data-tone=accent]) {color:#bca8d8;}
#altar-nexus .nx-state:is([data-tone=neutral],[data-tone=muted]) {color:#bdafc7;}
#altar-nexus .nx-state:is([data-tone=danger],[data-tone=error]) {color:#e5a2ad;}
#altar-nexus .nx-empty {padding:21px 6px;border-top:1px solid var(--line);color:var(--soft);}
#altar-nexus .nx-dock {position:relative;z-index:5;width:var(--pane);flex:0 0 var(--pane);min-width:0;min-height:0;display:flex;flex-direction:column;background:#1d1821;border-left:1px solid var(--line);}
#altar-nexus .nx-dock-toolbar {height:59px;align-items:center;flex:none;display:flex;gap:4px;padding:8px 13px;border-bottom:1px solid var(--line);}
#altar-nexus .nx-dock-toolbar button:last-child {margin-left:auto;}
#altar-nexus .nx-detail {flex:1;min-height:0;overflow:auto;scrollbar-width:thin;padding:25px 17px 28px;}
#altar-nexus .nx-detail .nx-kicker {font:500 10.6px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#beabc9;}
#altar-nexus .nx-detail h2 {font:500 25px/1.18 var(--serif);overflow-wrap:anywhere;letter-spacing:-.055em;margin:7px 0 9px;}
#altar-nexus .nx-detail .nx-summary {font:13px/1.6 var(--sans);color:#c9bfd0;overflow-wrap:anywhere;}
#altar-nexus .nx-detail .nx-state {margin-top:10px;}
#altar-nexus .nx-detail-group {border-top:1px solid var(--line);margin-top:19px;padding-top:15px;}
#altar-nexus .nx-detail-group h3 {font:500 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.075em;color:#bca9c8;margin-bottom:8px;}
#altar-nexus .nx-detail dl {display:grid;grid-template-columns:minmax(62px,.72fr) minmax(0,1.28fr);font:12px/1.45 var(--sans);row-gap:8px;column-gap:12px;align-items:baseline;}
#altar-nexus .nx-detail dt {color:#b9acbf;}
#altar-nexus .nx-detail dd {color:#ede4f2;text-align:right;overflow-wrap:anywhere;font-size:12px;}
#altar-nexus .nx-actions {display:flex;flex-wrap:wrap;gap:7px;margin-top:19px;}
#altar-nexus .nx-act {padding:7px 11px;background:#382b40;color:#ead3f8;border:1px solid #55435f;border-radius:6px;font:550 12px/1.4 var(--sans);}
#altar-nexus .nx-act:hover {background:#46334e;}
#altar-nexus .nx-act + .nx-act {background:#26212c;border-color:#433949;color:#ccc0d4;}
#altar-nexus .nx-detail-link {background:transparent;border:0;width:100%;padding:7px 0;display:flex;gap:8px;align-items:center;text-align:left;}
#altar-nexus .nx-detail-link>span {flex:1;display:grid;gap:3px;}
#altar-nexus .nx-detail-link strong {font:550 13px/1.3 var(--sans);}
#altar-nexus .nx-detail-link small {font:11px/1.4 var(--mono);color:#bcadc5;}
#altar-nexus .nx-detail-link:hover strong {text-decoration:underline;}
#altar-nexus .nx-dir-grip,#altar-nexus .nx-dock-grip {position:absolute;top:0;bottom:0;width:8px;z-index:7;touch-action:none;cursor:col-resize;}
#altar-nexus .nx-dir-grip {right:-4px;}
#altar-nexus .nx-dock-grip {left:-4px;}
#altar-nexus :is(.nx-dir-grip,.nx-dock-grip):hover {background:#b297c745;}
#altar-nexus .nx-ann {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
#altar-nexus .nx-sessions {margin:13px 0 0;display:grid;gap:7px;}
#altar-nexus .nx-question {border-left:2px solid #ad88bf;background:#2a222f;padding:9px 11px;border-radius:0 5px 5px 0;}
#altar-nexus .nx-detail textarea {width:100%;padding:9px;color:#ede6f3;background:#19151d;border:1px solid #493c52;border-radius:6px;min-height:74px;font:13px/1.4 var(--sans);resize:vertical;}
#altar-nexus .nx-detail details summary {font-size:13px;color:#dccee6;cursor:pointer;margin:10px 0;}
#altar-nexus .nx-file {white-space:pre-wrap;overflow-wrap:anywhere;color:#d9cfde;font:12px/1.6 var(--mono);}
#altar-nexus .nx-meta [data-show-directory] {background:#2a2331;}
#altar-nexus .apps-pop .app-links {display:grid;}
#altar-nexus .app-search input {min-width:0;color:var(--ink);background:#211c27;border:1px solid #584662;border-radius:5px;padding:7px;}
@container(max-width:470px){
 #altar-nexus .nx-snapshot {align-items:flex-start;flex-wrap:wrap;gap:4px 15px;}
 #altar-nexus .nx-results th:first-child {width:46%;}
 #altar-nexus .nx-results th:last-child {width:23%;}
 #altar-nexus .nx-results td,#altar-nexus .nx-results th {padding-left:5px;padding-right:5px;}
 #altar-nexus .nx-object .nx-mark {display:none;}
 #altar-nexus .nx-heading p {font-size:12px;}
 #altar-nexus .nx-destination {gap:8px;min-height:60px;}
 #altar-nexus .nx-dest-info {display:none;}
}
@media(max-width:1200px){#altar-nexus{--directory:154px;--pane:264px;--rail:136px;}}
@media(max-width:890px){#altar-nexus .nx-directory {position:absolute;top:0;bottom:0;left:0;width:min(var(--directory),90%);box-shadow:8px 0 30px #0b081455;}}
@media(max-width:690px){

			return detailHeading("Instance snapshot", "At this snapshot") + group("Runtime", [["Admission", "Open"], ["Checked", "09:42 UTC"]]) + "<section class=\"nx-detail-group\"><h3>Latest request</h3>" + shortLink("transitions", last.id, last.id + " · " + last.cells[0].text, last.sub) + "</section><section class=\"nx-detail-group\"><h3>Paired operators</h3>" + model("colleagues").rows.map((r) => shortLink("colleagues", r.id, r.title, r.cells[0].text)).join("") + "</section>";
		}
		const v = detail();
		if (!v) return detailHeading(name(state.section), "Select a record", "Choose a row to inspect its identity and observations.");
		return detailHeading(v.eyebrow, v.title, v.description) + (v.status ? stat(v.status) : "") + (v.groups || []).map((g) => group(g.title, g.fields)).join("") + (v.actions?.length ? "<div class=\"nx-actions\">" + v.actions.map((a) => "<button class=\"nx-act\" data-action-id=\"" + e(a.id) + "\">" + e(a.label) + "</button>").join("") + "</div>" : "");
	}
	function render() {
		el(".nx-directory").hidden = !state.directory;
		el("[data-show-directory]").hidden = state.directory;
		el("[data-show-directory]").setAttribute("aria-expanded", String(state.directory));
		el(".nx-section-links").innerHTML = sectionButton("overview") + families.map(([g, ids]) => "<h3>" + e(g) + "</h3>" + ids.map(sectionButton).join("")).join("");
		const home = state.section === "overview";
		el(".nx-home").hidden = !home;
		el(".nx-list").hidden = home;
		el(".nx-heading h1").textContent = home ? "Instance overview" : name(state.section);
		el(".nx-heading p").textContent = home ? "Readiness, requests and access on this vessel." : model().description;
		if (home) el(".nx-home").innerHTML = homeView();
		else {
			const v = model(), input = el(".nx-search input");
			input.value = state.query;
			input.placeholder = "Search " + (state.section === "iam" ? state.tab : name(state.section).toLowerCase()) + "…";
			input.setAttribute("aria-label", input.placeholder.slice(0, -1));
			el(".nx-tabs").innerHTML = (v.tabs || []).map((t) => "<button data-view=\"" + t.id + "\" aria-pressed=\"" + (state.tab === t.id) + "\">" + e(t.label) + "</button>").join("");
			el(".nx-active-filter").innerHTML = v.filter ? "<button class=\"nx-filter-chip\" data-action-id=\"people-clear-filter\" aria-label=\"Clear filter " + e(v.filter) + "\">" + e(v.filter) + " ×</button>" : "";
			filterRows();
		}
		el(".nx-dock").hidden = !state.dock;
		el(".nx-open-tools").hidden = state.dock;
		el(".nx-open-tools").setAttribute("aria-expanded", String(state.dock));
		for (const b of app.querySelectorAll("[data-tool]")) b.setAttribute("aria-pressed", String(b.dataset.tool === state.tool));
		const panel = el(".nx-detail");
		panel.innerHTML = toolView();
		const draft = panel.querySelector("textarea");
		if (draft) draft.value = drafts.get(state.session) || "";
	}
	mountChrome(app);
	el("[data-hide-directory]").innerHTML = svg("left", 15);
	el("[data-show-directory]").innerHTML = svg("layers", 16);
	el(".nx-open-tools").innerHTML = svg("inspect", 17);
	el(".nx-search-mark").innerHTML = svg("search", 15);
	el(".nx-dock-toolbar").innerHTML = tabs.map(([id, mark, label]) => "<button class=\"nx-icon\" data-tool=\"" + id + "\" aria-label=\"" + label + "\" title=\"" + label + "\">" + svg(mark, 17) + "</button>").join("") + "<button class=\"nx-icon\" data-hide-dock aria-label=\"Hide side panel\" title=\"Hide side panel\">" + svg("right", 16) + "</button>";
	function runAction(action) {
		const previous = state.section;
		if (!applyOperation(action, state) && !applyPeople(action, state)) return;
		if (previous !== state.section && !action.startsWith("people-")) state.query = "";
		if (action === "people-clear-filter" && narrowDetail()) state.dock = false;
		else if (state.selected) {
			state.tool = "record";
			state.dock = true;
		}
		render();
		if (state.selected && state.dock) el(".nx-detail h2").focus({ preventScroll: true });
		else el(".nx-heading h1").focus({ preventScroll: true });
		announce(detail()?.title || name(state.section));
		save();
	}
	function hideDock() {
		state.dock = false;
		render();
		backToRow();
		save();
	}
	app.addEventListener("click", (ev) => {
		const b = ev.target.closest("button");
		if (b?.dataset.section) {
			chosenSection(b.dataset.section);
			return;
		}
		if (b?.dataset.action === "full") {
			chosenSection("overview");
			return;
		}
		if (b?.dataset.visit) {
			go(b.dataset.visit, b.dataset.target);
			return;
		}
		if (b?.dataset.actionId) {
			runAction(b.dataset.actionId);
			return;
		}
		if (b?.dataset.view) {
			state.tab = b.dataset.view;
			state.selected = null;
			state.query = "";
			state.tool = "record";
			render();
			el("[data-view=\"" + state.tab + "\"]").focus();
			save();
			return;
		}
		const row = ev.target.closest("tr[data-id]");
		if (row) {
			selectRow(row.dataset.id);
			return;
		}
		if (!b) return;
		if (b.hasAttribute("data-hide-dock")) {
			hideDock();
			return;
		}
		if (b.hasAttribute("data-show-dock")) {
			state.dock = true;
			if (smallDirectory()) state.directory = false;
			render();
			el("[data-tool=\"" + state.tool + "\"]").focus();
			save();
			return;
		}
		if (b.hasAttribute("data-show-directory") || b.hasAttribute("data-hide-directory")) {
			state.directory = b.hasAttribute("data-show-directory");
			if (state.directory && smallDirectory()) state.dock = false;
			render();
			(state.directory ? el(".nx-section-links [aria-current]") : el("[data-show-directory]")).focus();
			save();
			return;
		}
		if (b.dataset.tool) {
			state.tool = b.dataset.tool;
			render();
			b.focus();
			save();
			return;
		}
		const session = Object.keys(sessionMessages).find((key) => key === b.dataset.seance);
		if (session) {
			state.session = session;
			render();
			el(".nx-detail h2").focus();
			return;
		}
		const file = Object.keys(files).find((key) => key === b.dataset.file);
		if (file) {
			state.currentFile = file;
			render();
			el(".nx-detail h2").focus();
			return;
		}
	});
	app.addEventListener("input", (ev) => {
		if (ev.target.matches(".nx-search input")) {
			state.query = ev.target.value;
			filterRows();
			save();
		}
		if (ev.target.matches(".nx-detail textarea")) drafts.set(state.session, ev.target.value);
	});
	app.addEventListener("keydown", (ev) => {
		if (ev.key !== "Escape" || !el(".apps-pop").hidden) return;
		if (state.directory && smallDirectory() && el(".nx-directory").contains(ev.target)) {
			state.directory = false;
			render();
			el("[data-show-directory]").focus();
			save();
		} else if (state.dock) hideDock();
	});
	function split(selector, pane, property, dir, min, max) {
		const handle = el(selector), target = el(pane);
		let drag = null;
		function apply(value) {
			const room = app.clientWidth - el(".nx-rail").offsetWidth;
			const hi = Math.min(max, Math.max(min, Math.floor(room * (smallDirectory() ? .88 : .4))));
			const n = Math.round(Math.max(min, Math.min(hi, value)));
			app.style.setProperty(property, n + "px");
			handle.setAttribute("aria-valuemin", min);
			handle.setAttribute("aria-valuemax", hi);
			handle.setAttribute("aria-valuenow", n);
			return n;
		}
		const base = property === "--pane" ? app.clientWidth <= 1200 ? 264 : 292 : app.clientWidth <= 1200 ? 154 : 169;
		function sync() {
			apply(Number.isFinite(state.widths[property]) ? state.widths[property] : base);
		}
		handle.onpointerdown = (ev) => {
			drag = {
				x: ev.clientX,
				width: target.offsetWidth
			};
			handle.setPointerCapture(ev.pointerId);
			ev.preventDefault();
		};
		handle.onpointermove = (ev) => {
			if (drag) state.widths[property] = apply(drag.width + dir * (ev.clientX - drag.x));
		};
		handle.onpointerup = handle.onpointercancel = () => {
			if (drag) save();
			drag = null;
		};
		handle.onkeydown = (ev) => {
			if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
			ev.preventDefault();
			state.widths[property] = apply(target.offsetWidth + dir * (ev.key === "ArrowLeft" ? -16 : 16));
			save();
		};
		sync();
		return sync;
	}
	var resizeDir = split(".nx-dir-grip", ".nx-directory", "--directory", 1, 136, 340);
	var resizeDock = split(".nx-dock-grip", ".nx-dock", "--pane", -1, 238, 500);
	var wasSmall = smallDirectory();
	new ResizeObserver(() => {
		const narrow = smallDirectory();
		if (wasSmall !== narrow) {
			state.directory = !narrow;
			if (narrow) state.dock = false;
			wasSmall = narrow;
			render();
		}
		resizeDir();
		resizeDock();
	}).observe(app);
	function restore(snapshot) {
		const s = snapshot?.privateContent;
		if (!s || s.version !== 1 || JSON.stringify(s) === saved || !Object.hasOwn(sections, s.section)) return;
		state.section = s.section;
		state.selected = typeof s.selected === "string" ? s.selected : null;
		state.tab = s.tab === "roles" ? "roles" : "grants";
		state.query = String(s.query || "").slice(0, 200);
		state.tool = tabs.some(([id]) => id === s.tool) ? s.tool : "record";
		state.ops = {
			submitted: s.ops?.submitted === true,
			preview: typeof s.ops?.preview === "string" ? s.ops.preview : null
		};
		state.people = {};
		for (const k of [
			"principal",
			"role",
			"returnUser",
			"returnQuery"
		]) if (typeof s.people?.[k] === "string") state.people[k] = s.people[k].slice(0, 200);
		state.widths = s.widths && typeof s.widths === "object" ? s.widths : {};
		state.lastRows = {};
		for (const k of Object.keys(sections)) {
			const v = s.lastRows?.[k];
			if (v) state.lastRows[k] = {
				selected: typeof v.selected === "string" ? v.selected : null,
				query: String(v.query || "").slice(0, 200)
			};
		}
		state.directory = Boolean(s.directory);
		state.dock = Boolean(s.dock);
		if (smallDirectory() && state.dock) state.directory = false;
		if (!detail()) state.selected = null;
		resizeDir();
		resizeDock();
		render();
	}
	render();
	restore(window.openai?.widgetState);
	window.addEventListener("openai:set_globals", (ev) => {
		if (ev.detail?.globals?.widgetState) restore(ev.detail.globals.widgetState);
	});
})();
</script>
