---
# Read-only application acceptance; protocol 2 also observes the administrator-owned kernel and UDP prerequisites.
- name: Observe one LychD body without changing it
  hosts: lychd_hosts
  gather_facts: false
  connection: ssh
  remote_user: lychd
  become: false
  serial: 1
  vars:
    ansible_user: lychd
    ansible_become: false
  tasks:
    - name: Classify the application
      ansible.builtin.include_role:
        name: lychd_app
        tasks_from: classify

    - name: Require a running body for acceptance
      ansible.builtin.assert:
        that: lychd_app_observed.state == 'running'
        fail_msg: "State {{ lychd_app_observed.state }}: {{ lychd_app_observed.reasons }}"

    - name: Observe acceptance
      ansible.builtin.include_role:
        name: lychd_app
        tasks_from: verify

- name: Observe the protocol-2 host prerequisites without changing them
  hosts: lychd_hosts
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: Verify the host WireGuard module and boot entry without mutation
      ansible.builtin.include_role:
        name: lychd_app
        tasks_from: tether_kernel_verify
      when: lychd_app_profile | default('empty-extensions-container') == 'tether-container-v1'

    - name: Verify the normalized listener's effective OS firewall zone and port
      ansible.builtin.include_role:
        name: lychd_app
        tasks_from: firewall_verify
      when: lychd_app_profile | default('empty-extensions-container') == 'tether-container-v1'
