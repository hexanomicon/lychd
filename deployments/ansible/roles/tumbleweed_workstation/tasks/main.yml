---
- name: Validate workstation boundaries before changes
  ansible.builtin.import_tasks: preflight.yml

- name: Prepare the selected personal shell using the shared role
  ansible.builtin.include_role:
    name: tumbleweed_shell
  vars:
    lychd_shell_user: "{{ lychd_workstation_user }}"

- name: Observe required package state
  ansible.builtin.import_tasks: packages.yml

- name: Report conditional check-mode changes without mutation
  ansible.builtin.debug:
    msg:
      missing_packages: "{{ lychd_workstation_missing_packages }}"
      personal_files: "{{ (lychd_workstation_file_plan.stdout | from_json).changed }}"
      firefox_policy: "{{ (lychd_workstation_policy_plan.stdout | default('{\"changed\": []}') | from_json).changed }}"
      pending: Repository resolution, installed shell/font behavior and Firefox extension installation require real acceptance.
  changed_when: >-
    lychd_workstation_missing_packages | length > 0 or
    (lychd_workstation_file_plan.stdout | from_json).changed | length > 0 or
    (lychd_workstation_policy_plan.stdout | default('{"changed": []}') | from_json).changed | length > 0
  when: ansible_check_mode

- name: Install only missing packages from existing repositories
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/zypper', '--non-interactive', '--no-refresh', 'install', '--no-recommends', '--'] + lychd_workstation_missing_packages }}"
  changed_when: true
  when: not ansible_check_mode and lychd_workstation_missing_packages | length > 0

- name: Publish reserved personal files with only personal-user authority
  become_user: "{{ lychd_workstation_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/user_config.py') }}"
      - apply
    stdin: >-
      {{ {'kind': 'user', 'shell': lychd_shell | default('zsh'), 'user': lychd_workstation_user, 'identity': lychd_workstation_identity,
          'files': lychd_workstation_files} | to_json }}
  register: lychd_workstation_file_apply
  changed_when: (lychd_workstation_file_apply.stdout | from_json).changed | length > 0
  when: not ansible_check_mode

- name: Publish explicitly selected machine-wide Dark Reader policy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/user_config.py') }}"
      - apply
    stdin: '{"kind": "policy"}'
  register: lychd_workstation_policy_apply
  changed_when: (lychd_workstation_policy_apply.stdout | from_json).changed | length > 0
  when: not ansible_check_mode and lychd_workstation_dark_reader

- name: Observe the resulting configuration and packages
  ansible.builtin.import_tasks: verify.yml
  when: not ansible_check_mode
