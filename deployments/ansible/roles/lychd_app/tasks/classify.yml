---
- name: Validate direct runtime SSH and the pinned revision
  ansible.builtin.assert:
    that:
      - ansible_user == 'lychd'
      - not (ansible_become | default(false) | bool)
      - lychd_source_revision is match('^[0-9a-f]{40}$')
      - lychd_source_uv_sha256 | default('') is match('^[0-9a-f]{64}$')
    fail_msg: "Application classification requires source-vars.json (exact source and tool receipt) and direct lychd SSH."

- name: Verify the versioned source before executing any installed CLI
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/../lychd_source/files/source_guard.py') }}"
      - "{{ lychd_source_revision }}"
      - "{{ lychd_source_uv_sha256 }}"
      - "{{ lychd_source_python | default('3.14.8') }}"
  changed_when: false
  check_mode: false

- name: Require an explicitly supported profile
  ansible.builtin.assert:
    that: lychd_app_profile in ['empty-extensions-container', 'tether-container-v1']

- name: Verify the normalized immutable public Tether campaign
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/tether_intent.py') }}"
      - verify
    stdin: "{{ {'source_sha256': lychd_tether_intent_sha256, 'archive_sha256': lychd_tether_image_archive_sha256, 'archive_manifest_digest': lychd_tether_image_manifest_digest, 'image_id': lychd_tether_image_id, 'revision': lychd_source_revision} | to_json }}"
  register: lychd_tether_campaign
  changed_when: false
  check_mode: false
  when: lychd_app_profile == 'tether-container-v1'

- name: Classify the application without effects
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/app_probe.py') }}"
      - classify
    stdin: "{{ {'revision': lychd_source_revision, 'image_id': lychd_image_id | default(''), 'profile': lychd_app_profile, 'intent': lychd_tether_intent_remote, 'tether_image_id': lychd_tether_image_id} | to_json }}"
  register: lychd_app_classify
  changed_when: false
  check_mode: false

- name: Retain the observed application state
  ansible.builtin.set_fact:
    lychd_app_observed: "{{ lychd_app_classify.stdout | from_json }}"

- name: Show the classification
  ansible.builtin.debug:
    msg:
      state: "{{ lychd_app_observed.state }}"
      reasons: "{{ lychd_app_observed.reasons }}"
      config: "{{ lychd_app_observed.facts.configuration | default('n/a') }}"
      configured_image: "{{ lychd_app_observed.facts.image | default('n/a') }}"
