---
- name: Query the installed WireGuard tools package
  ansible.builtin.command:
    argv: [/usr/bin/rpm, -q, wireguard-tools]
  register: lychd_tether_tools_package
  failed_when: lychd_tether_tools_package.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Predict only the missing WireGuard tools package in check mode
  ansible.builtin.debug:
    msg: "wireguard-tools would be installed from existing repositories; executable readiness is not yet proved."
  when: ansible_check_mode and lychd_tether_tools_package.rc == 1
  changed_when: true

- name: Install only the absent WireGuard tools package from existing repositories
  ansible.builtin.command:
    argv: [/usr/bin/zypper, --non-interactive, --no-refresh, install, --no-recommends, --, wireguard-tools]
  when: not ansible_check_mode and lychd_tether_tools_package.rc == 1
  changed_when: true

- name: Prove actual WireGuard tools after preparation when the package exists
  ansible.builtin.import_tasks: tether_tools_verify.yml
  when: not ansible_check_mode or lychd_tether_tools_package.rc == 0
