---
# Every application effect and deployment decision belongs to the pinned native CLI.
# Each step re-classifies before the next; anything outside the admitted chain stops the host.
- name: Classify before application effects
  ansible.builtin.include_tasks: classify.yml

- name: Refuse application effects outside the admitted chain
  ansible.builtin.assert:
    that: lychd_app_observed.state in ['absent', 'initialized', 'bound_inactive']
    fail_msg: "Application state {{ lychd_app_observed.state }} is not mutable by automation: {{ lychd_app_observed.reasons }}. For prepared_waiting_keys, use native tether import-key for {{ lychd_app_observed.facts.tether_preparation.missing_secrets | default([]) }} and rerun."

- name: Report the check-mode boundary for application effects
  ansible.builtin.debug:
    msg: "State {{ lychd_app_observed.state }}: init/bind/start would follow; check mode stops here."
  when: ansible_check_mode

- name: End this host before any application effect in check mode
  ansible.builtin.meta: end_host
  when: ansible_check_mode

- name: Stage public Tether intent and verified image before original initialization
  ansible.builtin.include_tasks: tether_stage.yml
  when: lychd_app_profile == 'tether-container-v1'

- name: Select the closed native protocol arguments
  ansible.builtin.set_fact:
    lychd_app_init_profile_args: "{{ ['--profile', 'tether-container-v1', '--intent', lychd_tether_intent_remote] if lychd_app_profile == 'tether-container-v1' else [] }}"
    lychd_app_bind_args: "{{ ['tether', 'bind'] if lychd_app_profile == 'tether-container-v1' else ['bind'] }}"
    lychd_app_status_args: "{{ ['--deployment-profile', 'tether-container-v1', '--deployment-intent', lychd_tether_intent_remote, '--deployment-tether-image-id', lychd_tether_image_id] if lychd_app_profile == 'tether-container-v1' else [] }}"
    lychd_app_protocol: "{{ 2 if lychd_app_profile == 'tether-container-v1' else 1 }}"

# Block conditions are re-evaluated per task, so fix the step plan before re-classifying inside it.
- name: Fix the admitted step plan from the entry state
  ansible.builtin.set_fact:
    lychd_app_step_init: "{{ lychd_app_observed.state == 'absent' }}"
    lychd_app_step_bind: "{{ lychd_app_observed.state in ['absent', 'initialized'] }}"
    lychd_app_step_prepare: "{{ lychd_app_profile == 'tether-container-v1' and lychd_app_observed.state in ['absent', 'initialized'] }}"

- name: Initialize an absent installation
  when: lychd_app_step_init | bool
  block:
    - name: Preview initialization
      ansible.builtin.command:
        argv: "{{ [lychd_app_cli, 'init', '--web-image', lychd_app_image_ref, '--dry-run'] + lychd_app_init_profile_args }}"
        chdir: "{{ lychd_app_source }}"
      environment: "{{ lychd_app_env }}"
      register: lychd_app_init_plan
      changed_when: false

    - name: Initialize the Codex and Crypt
      ansible.builtin.command:
        argv: "{{ [lychd_app_cli, 'init', '--web-image', lychd_app_image_ref] + lychd_app_init_profile_args }}"
        chdir: "{{ lychd_app_source }}"
      environment: "{{ lychd_app_env }}"
      changed_when: true

    - name: Re-classify after initialization
      ansible.builtin.include_tasks: classify.yml

    - name: Require the unedited initialized state
      ansible.builtin.assert:
        that:
          - lychd_app_observed.state == 'initialized'
          - lychd_app_observed.facts.configuration.state == 'original'

- name: Prepare or resume preparation of an originally initialized Tether installation
  when: lychd_app_step_prepare | bool
  block:
    - name: Prepare native Tether custody from the original public intent
      ansible.builtin.command:
        argv: ["{{ lychd_app_cli }}", tether, prepare, --intent, "{{ lychd_tether_intent_remote }}"]
        chdir: "{{ lychd_app_source }}"
      environment: "{{ lychd_app_env }}"
      when: lychd_app_profile == 'tether-container-v1'
      register: lychd_tether_preparation
      changed_when: (lychd_tether_preparation.stdout | from_json).changed

    - name: Re-classify preparation and key admission
      ansible.builtin.include_tasks: classify.yml

    - name: Stop for explicit native key import
      ansible.builtin.assert:
        that: lychd_app_observed.state == 'initialized'
        fail_msg: "Tether preparation requires native import-key for missing_secrets: {{ lychd_app_observed.facts.tether_preparation.missing_secrets | default([]) }}. Import keys explicitly, then rerun application deployment."

- name: Bind an initialized installation
  when: lychd_app_step_bind | bool
  block:
    - name: Require the original pinned initialized state before binding
      ansible.builtin.assert:
        that: lychd_app_observed.state == 'initialized'

    - name: Preview binding
      ansible.builtin.command:
        argv: "{{ [lychd_app_cli] + lychd_app_bind_args + ['--dry-run'] }}"
        chdir: "{{ lychd_app_source }}"
      environment: "{{ lychd_app_env }}"
      changed_when: false

    - name: Bind the generated units and create only absent core secrets
      ansible.builtin.command:
        argv: "{{ [lychd_app_cli] + lychd_app_bind_args }}"
        chdir: "{{ lychd_app_source }}"
      environment: "{{ lychd_app_env }}"
      changed_when: true

    - name: Re-classify after binding
      ansible.builtin.include_tasks: classify.yml

    - name: Require a bound, inactive body
      ansible.builtin.assert:
        that: lychd_app_observed.state == 'bound_inactive'

- name: Stop before startup unless the recovery plan was approved for this host
  when: not (lychd_app_start_authorized | bool)
  block:
    - name: Report the startup boundary
      ansible.builtin.debug:
        msg: >-
          Bound and inactive. `lychd start` is withheld: pass lychd_app_start_authorized=true only after
          the host's recovery plan is approved, because active stop/restart is not yet delivered.

    - name: End this host without starting
      ansible.builtin.meta: end_host

- name: Start through the CLI's guarded inactive bootstrap
  ansible.builtin.command:
    argv: ["{{ lychd_app_cli }}", start]
    chdir: "{{ lychd_app_source }}"
  environment: "{{ lychd_app_env }}"
  when: lychd_app_observed.state == 'bound_inactive' and (lychd_app_start_authorized | bool)
  changed_when: true

- name: Activate and verify Tether through native lifecycle after the guarded Core bootstrap
  ansible.builtin.command:
    argv: ["{{ lychd_app_cli }}", tether, activate]
    chdir: "{{ lychd_app_source }}"
  environment: "{{ lychd_app_env }}"
  when: lychd_app_profile == 'tether-container-v1' and (lychd_app_start_authorized | bool)
  changed_when: true

- name: Wait read-only for the native deployment assessment to converge
  ansible.builtin.command:
    argv: "{{ [lychd_app_cli, 'status', '--json', '--deployment-revision', lychd_source_revision, '--deployment-image-id', lychd_image_id] + lychd_app_status_args }}"
    chdir: "{{ lychd_app_source }}"
  environment: "{{ lychd_app_env }}"
  register: lychd_app_units
  until: lychd_app_units.rc == 0 and (lychd_app_units.stdout | from_json).schema == 'lychd.deployment' and (lychd_app_units.stdout | from_json).version == (lychd_app_protocol | int) and (lychd_app_units.stdout | from_json).state == 'running'
  retries: "{{ lychd_app_start_poll_retries }}"
  delay: "{{ lychd_app_start_poll_delay }}"
  changed_when: false
  failed_when: false

- name: Report non-convergence without intervening
  ansible.builtin.assert:
    that: lychd_app_units.rc == 0 and (lychd_app_units.stdout | from_json).schema == 'lychd.deployment' and (lychd_app_units.stdout | from_json).version == (lychd_app_protocol | int) and (lychd_app_units.stdout | from_json).state == 'running'
    fail_msg: >-
      Native deployment assessment did not reach running. Automation does not stop, restart or
      kill anything; follow the approved recovery plan and `lychd logs`.
