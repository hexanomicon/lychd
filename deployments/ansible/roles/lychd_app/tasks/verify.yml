---
- name: Validate direct runtime SSH and the pinned revision
  ansible.builtin.assert:
    that:
      - ansible_user == 'lychd'
      - not (ansible_become | default(false) | bool)
      - lychd_source_revision is match('^[0-9a-f]{40}$')
      - lychd_source_uv_sha256 | default('') is match('^[0-9a-f]{64}$')

- name: Verify the pinned source before native application acceptance
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/../lychd_source/files/source_guard.py') }}"
      - "{{ lychd_source_revision }}"
      - "{{ lychd_source_uv_sha256 }}"
      - "{{ lychd_source_python | default('3.14.8') }}"
  changed_when: false
  check_mode: false

- name: Verify the normalized immutable public Tether campaign
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/tether_intent.py') }}"
      - verify
    stdin: "{{ {'source_sha256': lychd_tether_intent_sha256, 'archive_sha256': lychd_tether_image_archive_sha256, 'archive_manifest_digest': lychd_tether_image_manifest_digest, 'image_id': lychd_tether_image_id, 'revision': lychd_source_revision} | to_json }}"
  register: lychd_tether_campaign
  changed_when: false
  check_mode: false
  when: lychd_app_profile == 'tether-container-v1'

- name: Observe server-local application acceptance without effects
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/app_probe.py') }}"
      - verify
    # Hosts deployed from the admitted archive must run its exact ID; earlier hand-built hosts are
    # checked by revision label and running-container/settings agreement instead.
    stdin: "{{ {'revision': lychd_source_revision, 'image_id': lychd_app_expected_image_id | default(''), 'profile': lychd_app_profile, 'intent': lychd_tether_intent_remote, 'tether_image_id': lychd_tether_image_id} | to_json }}"
  register: lychd_app_verify
  changed_when: false
  check_mode: false

- name: Retain acceptance evidence
  ansible.builtin.set_fact:
    lychd_app_acceptance: "{{ lychd_app_verify.stdout | from_json }}"

- name: Show every acceptance check
  ansible.builtin.debug:
    msg: "{{ lychd_app_acceptance.checks | map(attribute='name') | zip(lychd_app_acceptance.checks | map(attribute='ok'), lychd_app_acceptance.checks | map(attribute='detail')) | map('join', ' | ') | list }}"

- name: Require every acceptance check
  ansible.builtin.assert:
    that: lychd_app_acceptance.ok
    fail_msg: "Failed checks: {{ lychd_app_acceptance.checks | rejectattr('ok') | map(attribute='name') | list }}"
