---
- name: Require supported typed shell selection before changes
  ansible.builtin.assert:
    that:
      - lychd_shell is string
      - lychd_shell in ['zsh', 'fish']
      - lychd_shell_user is string
      - lychd_shell_user | length > 0
      - lychd_shell_set_login is boolean
    fail_msg: Select zsh or fish and one existing ordinary personal or administrator account.

- name: Observe the existing ordinary account and Tumbleweed without requiring KDE
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/user_config.py') }}"
      - shell-preflight
    stdin: "{{ {'user': lychd_shell_user, 'shell': lychd_shell, 'set_login': lychd_shell_set_login} | to_json }}"
  register: lychd_shell_observation
  check_mode: false
  changed_when: false

- name: Retain exact identity and selected startup defaults
  vars:
    _lychd_shell_zsh_hook: |
      # Managed by LychD interactive shell v1
      source "$HOME/.config/lychd-shell/zshrc"
  ansible.builtin.set_fact:
    lychd_shell_identity: "{{ (lychd_shell_observation.stdout | from_json).identity }}"
    lychd_shell_files: >-
      {{ {'.zshrc': _lychd_shell_zsh_hook,
          '.config/lychd-shell/zshrc': lookup('ansible.builtin.template', 'zshrc.j2')}
         if lychd_shell == 'zsh' else {} }}

- name: Inspect every shell destination with only the selected user's authority
  become_user: "{{ lychd_shell_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/user_config.py') }}"
      - plan
    stdin: >-
      {{ {'kind': 'shell', 'user': lychd_shell_user, 'shell': lychd_shell,
          'set_login': lychd_shell_set_login, 'identity': lychd_shell_identity,
          'files': lychd_shell_files} | to_json }}
  register: lychd_shell_file_plan
  check_mode: false
  changed_when: false

- name: Observe the selected shell package
  ansible.builtin.command:
    argv: [/usr/bin/rpm, -q, "{{ lychd_shell }}"]
  register: lychd_shell_package
  failed_when: lychd_shell_package.rc not in [0, 1]
  check_mode: false
  changed_when: false
