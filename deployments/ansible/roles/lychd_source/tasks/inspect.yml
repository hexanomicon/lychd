---
- name: Validate immutable inputs and direct SSH policy
  ansible.builtin.assert:
    that:
      - ansible_connection | default('ssh') == 'ssh'
      - ansible_user == 'lychd'
      - not (ansible_become | bool)
      - lychd_source_revision is match('^[0-9a-f]{40}$')
      - lychd_source_uv_sha256 is match('^[0-9a-f]{64}$')
      - lychd_source_python in ['3.14.8', '3.15.0']
    fail_msg: "Supply an exact source SHA and uv checksum receipt; connect directly as lychd."

- name: Inspect identity, path ownership, receipt and immutable checkout
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/source_guard.py') }}"
      - "{{ lychd_source_revision }}"
      - "{{ lychd_source_uv_sha256 }}"
      - "{{ lychd_source_python }}"
  register: lychd_source_guard
  changed_when: false
  check_mode: false

- name: Retain the bounded source observation
  ansible.builtin.set_fact:
    lychd_source_observed: "{{ lychd_source_guard.stdout | from_json }}"
    lychd_source_checkout: "/home/lychd/src/lychd-{{ lychd_source_revision }}"
    lychd_source_uv_binary: /home/lychd/.local/lib/lychd-tools/uv-0.13.4
