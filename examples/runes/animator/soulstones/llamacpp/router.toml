# ~/.config/lychd/runes/animator/soulstones/llamacpp/router.toml

name = "llama-router"
description = "llama.cpp router-mode Soulstone backed by a models preset INI."
groups = ["local-llm"]
port = 8080

# LychD mounts ~/models to /models by default. This extra mount carries the
# llama.cpp router preset into the container.
volumes = [
  "%h/.config/lychd/llamacpp:/presets:ro,Z",
]

startup_mode = "router"
models_dir = "/models"
models_preset = "/presets/router-models.ini"
models_max = 2
models_autoload = true
sleep_idle_seconds = 900

n_gpu_layers = 99
n_ctx = 8192
n_parallel = 1
flash_attn = true
cache_type_k = "q8_0"
cache_type_v = "q8_0"
split_mode = "layer"
jinja = true

# Extra flags are appended after adapter-managed defaults.
extra_args = [
  "--chat_template_kwargs",
  "{\"enable_thinking\":false}",
]
